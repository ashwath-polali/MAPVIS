# Refuses a commit that carries a secret.
#
# Every key this tool needs is read from the environment and never has a default
# in the code, so nothing here should ever fire. This exists because "should"
# is not a guarantee: one pasted connection string in one commit is permanent,
# and rewriting history afterwards does not un-share what was already fetched.
#
# fetch-depth: 0 so a scheduled run reads the whole history and not just the
# newest commit. The weekly run is the one that catches a secret added by a
# push that happened while this workflow was disabled or failing.
#
# GITLEAKS_LICENSE is free and only required for repositories owned by an
# organization. On a personal account the line below is ignored. If this repo
# ever moves to an org, get a key at gitleaks.io and add it as a secret.

name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
